<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>LinkedIn Billedgenerator — We Lead Projects</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f0f0f0; padding: 32px; }
  h1 { font-size: 18px; font-weight: 600; margin-bottom: 24px; color: #333; }
  .controls { display: flex; gap: 12px; align-items: center; margin-bottom: 24px; flex-wrap: wrap; }
  button { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; }
  .btn-prev, .btn-next { background: #e8e0e0; color: #333; }
  .btn-prev:hover, .btn-next:hover { background: #d0c8c8; }
  .btn-dl { background: #cc2222; color: white; }
  .btn-dl:hover { background: #a81a1a; }
  .btn-all { background: #2d1a1a; color: white; }
  .btn-all:hover { background: #1a0f0f; }
  .counter { font-size: 14px; color: #666; }
  canvas { display: block; box-shadow: 0 4px 24px rgba(0,0,0,0.15); }
  .preview-wrap { display: inline-block; }
</style>
</head>
<body>
<h1>LinkedIn Billedgenerator — We Lead Projects</h1>
<div class="controls">
  <button class="btn-prev" onclick="navigate(-1)">← Forrige</button>
  <span class="counter" id="counter">1 / 14</span>
  <button class="btn-next" onclick="navigate(1)">Næste →</button>
  <button class="btn-dl" onclick="download()">Download PNG</button>
  <button class="btn-all" onclick="downloadAll()">Download alle 14</button>
</div>
<div class="preview-wrap">
  <canvas id="c" width="1080" height="1080" style="width:540px;height:540px;"></canvas>
</div>

<script>
const SIZE = 1080;
const RED = '#cc2222';
const DARK = '#1a1a1a';
const OFFWHITE = '#f7f5f5';
const LIGHT_GRAY = '#e8e0e0';
const WLP_GRAY = '#999999';

const posts = [
  { num: 15, hook: 'En frist er passeret.\nIngen ved præcis\nhvilke systemer der er omfattet.' },
  { num: 16, hook: 'Compliance\ner enten et fundament\neller en regning.' },
  { num: 17, hook: 'Hvis AI-udvalget\naldrig har sagt nej,\nhar ingen mandat til det.' },
  { num: 18, hook: 'Den rådgiver\nder aldrig siger fra\nleverer bekræftelse.' },
  { num: 19, hook: 'EA er en forsikring,\nikke et bureaukrati.' },
  { num: 20, hook: 'Den dyreste beslutning\ner at vente for længe\nmed at kortlægge det man har.' },
  { num: 21, hook: 'En pilot\nder ikke er stresstestet\ner en demo.' },
  { num: 22, hook: 'Det svære arbejde\ner at finde\ndet man ikke ved man har.' },
  { num: 23, hook: '\"Vi har styr\npå vores AI-systemer.\"\n\nDen undersøger jeg altid nærmere.' },
  { num: 24, hook: 'Data governance\ner ikke et dokument.\nDet er forudsætningen.' },
  { num: 25, hook: 'AI-governance\ner ikke et dokument\nman laver én gang.' },
  { num: 26, hook: 'Enterprise Architecture\ner værktøjet til at se\nregningen, før den forfalder.' },
  { num: 27, hook: 'De bedste virksomheder\npeger selv på mønsteret\nfør nogen beder om en redegørelse.' },
  { num: 28, hook: 'En ekstern rådgiver\ner ikke pengene værd\nnår konklusionen allerede er truffet.' },
  { num: 29, hook: 'AI-governance\nfejler aldrig\npå teknologien.' },
  { num: 30, hook: 'Reel ejerskab\ner synligt i om\nnogen nogensinde har sagt nej.' },
  { num: 31, hook: 'Den bedste AI-governance\njeg har set\nsad hos Enterprise Architecture.' },
  { num: 32, hook: 'Den billigste beslutning\ni et fejlslagent projekt\ner at stoppe det.' },
  { num: 33, hook: 'Mandat\nkommer ikke af en titel.\nDet kommer af at have haft ret.' },
  { num: 34, hook: 'De fejlslagne projekter\ner dem jeg husker\ndetaljerne fra.' },
  { num: 35, hook: 'Inden den næste AI-politik:\nhvem er det\nder siger nej?' },
  { num: 36, hook: 'Scope vokser.\nRisikoklassen\nvokser med det.' },
  { num: 37, hook: 'EU AI Act spørger ikke\nhvad I besluttede.\nDen spørger hvad I bruger.' },
  { num: 38, hook: 'Det er ikke\net ressourceproblem.\nDet er et ejerskabsproblem.' },
];

let current = 0;

function draw(ctx, post, index) {
  const S = SIZE;

  // Background
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, S, S);

  // Subtle off-white content area with slight inset
  ctx.fillStyle = OFFWHITE;
  ctx.fillRect(64, 64, S - 128, S - 128);

  // Red top accent bar
  ctx.fillStyle = RED;
  ctx.fillRect(64, 64, S - 128, 7);


  // Hook text — auto-fit font size to keep all lines inside box
  const lines = post.hook.split('\n');
  const nonEmpty = lines.filter(l => l.trim().length > 0);
  const hasAccentLine = nonEmpty.length >= 3;
  const maxW = S - (64 + 48) * 2;           // available width
  const boxTop = 64 + 7 + 60;               // below red bar + padding
  const boxBottom = S - 64 - 80 - 32;       // above divider
  const availH = boxBottom - boxTop;

  // Find largest font size where every line fits within maxW and total height fits
  let fontSize = 80;
  while (fontSize > 36) {
    ctx.font = `800 ${fontSize}px system-ui, -apple-system, sans-serif`;
    const lineH = fontSize * 1.28;
    const totalH = lines.length * lineH;
    const fits = lines.every(l => ctx.measureText(l).width <= maxW) && totalH <= availH;
    if (fits) break;
    fontSize -= 2;
  }

  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  const lineH = fontSize * 1.28;
  const totalHeight = lines.length * lineH;
  let startY = (S / 2) - (totalHeight / 2) + fontSize * 0.4;

  lines.forEach((line, i) => {
    const isAccent = hasAccentLine && i === lines.length - 1 && line.trim().length > 0;
    ctx.fillStyle = isAccent ? RED : DARK;
    ctx.font = `800 ${fontSize}px system-ui, -apple-system, sans-serif`;
    ctx.fillText(line, 64 + 48, startY + i * lineH);
  });

  // Bottom divider
  ctx.strokeStyle = LIGHT_GRAY;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(64 + 48, S - 64 - 80);
  ctx.lineTo(S - 64 - 48, S - 64 - 80);
  ctx.stroke();

  // Branding — rød prik + navn
  const dotY = S - 64 - 44;
  const dotR = 9;
  const textX = 64 + 48 + dotR * 2 + 14;
  ctx.fillStyle = RED;
  ctx.beginPath();
  ctx.arc(64 + 48 + dotR, dotY, dotR, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = DARK;
  ctx.font = `700 28px system-ui, -apple-system, sans-serif`;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText('We Lead Projects', textX, dotY);

  ctx.fillStyle = WLP_GRAY;
  ctx.font = `400 24px system-ui, -apple-system, sans-serif`;
  ctx.fillText('weleadprojects.com', textX, S - 64 - 13);

}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function render() {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  draw(ctx, posts[current], current);
  document.getElementById('counter').textContent = `Post ${posts[current].num} (${current + 1} / ${posts.length})`;
}

function navigate(dir) {
  current = (current + dir + posts.length) % posts.length;
  render();
}

function download() {
  const canvas = document.getElementById('c');
  const a = document.createElement('a');
  a.download = `linkedin-post-${posts[current].num}.png`;
  a.href = canvas.toDataURL('image/png');
  a.click();
}

async function downloadAll() {
  for (let i = 0; i < posts.length; i++) {
    current = i;
    render();
    await new Promise(r => setTimeout(r, 100));
    download();
    await new Promise(r => setTimeout(r, 300));
  }
  current = 0;
  render();
}

render();
</script>
</body>
</html>
